[package]
name = "wdroid"
version = "0.1.0"
edition = "2021"
description = "Waydroid contained in a desktop window — a minimal nested Wayland compositor"
license = "MIT"
authors = ["Martin Caminoa <martin5211@gmail.com>"]

[package.metadata.deb]
maintainer = "Martin Caminoa <martin5211@gmail.com>"
extended-description = """\
wdroid embeds Waydroid (Android in a container) in a normal desktop window \
by acting as a minimal nested Wayland compositor. It manages the Waydroid \
session lifecycle automatically and keeps a fixed-size Android display, \
scaling the view when the window is resized by the host."""
section = "utils"
priority = "optional"
# libEGL is dlopened at runtime, so cargo-deb's $auto scan cannot see it.
depends = "$auto, libegl1, libgles2"
recommends = "waydroid, wl-clipboard"
assets = [
    ["target/release/wdroid", "usr/bin/", "755"],
    ["packaging/wdroid.desktop", "usr/share/applications/", "644"],
    ["scripts/waydroid-up", "usr/share/wdroid/examples/waydroid-up", "755"],
    ["scripts/weston-clip-bridge", "usr/share/wdroid/examples/weston-clip-bridge", "755"],
    ["README.md", "usr/share/doc/wdroid/README.md", "644"],
]

[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = [
    "backend_winit",
    "renderer_glow",
    "wayland_frontend",
    "desktop",
] }
smithay-egui = { version = "=0.2.0", default-features = false, features = ["desktop_integration"] }
# same calloop smithay uses; only turns the signals source on
calloop = { version = "0.14", features = ["signals"] }
egui = "0.31"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# keep panic locations readable without embedding the full smithay debug info
debug = "line-tables-only"
